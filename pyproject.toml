[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-agent"
version = "0.1.0"
description = "BEAST — a local-first AI coding agent for your terminal, powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BEAST contributors" }]
keywords = ["ai", "coding-agent", "ollama", "llm", "tui", "cli", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Tools",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=8,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5",
]

[project.urls]
Homepage = "https://github.com/beast-agent/beast"

[project.scripts]
asap = "beast.entrypoint:main"

[tool.setuptools.packages.find]
include = ["beast*"]

[tool.setuptools.package-data]
"beast.ui" = ["styles.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["beast"]
omit = ["beast/ui/styles.tcss"]

[tool.coverage.report]
skip_empty = true
